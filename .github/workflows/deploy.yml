name: Deploy

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      deploy_images:
        description: "Build and push Docker images"
        required: false
        default: true
        type: boolean
      deploy_docs:
        description: "Deploy documentation"
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  configure:
    name: Configure Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
      deploy_images: ${{ steps.set-flags.outputs.deploy_images }}
      deploy_docs: ${{ steps.set-flags.outputs.deploy_docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: set-env
        name: Set deployment environment
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - id: set-tag
        name: Set image tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

      - id: set-flags
        name: Set deployment flags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy_images=${{ github.event.inputs.deploy_images }}" >> $GITHUB_OUTPUT
            echo "deploy_docs=${{ github.event.inputs.deploy_docs }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_images=true" >> $GITHUB_OUTPUT
            echo "deploy_docs=true" >> $GITHUB_OUTPUT
          fi

  approve:
    name: Approve Deployment
    needs: [configure]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.configure.outputs.environment }}
    steps:
      - name: Manual approval
        run: |
          echo "Deployment to ${{ needs.configure.outputs.environment }} approved"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

  build-and-push-images:
    name: Build & Push Docker Images
    needs: [configure, approve]
    if: needs.configure.outputs.deploy_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: commercepulse-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: runtime
            build-args: "INSTALL_DEV=false"
          - image: commercepulse-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: runner
            build-args: "NODE_ENV=production"
          - image: commercepulse-nginx
            context: ./infrastructure/nginx
            dockerfile: ./infrastructure/nginx/Dockerfile
            target:
            build-args:
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.configure.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.configure.outputs.environment == 'production' }}
            type=sha,format=long
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          build-args: ${{ matrix.build-args }}

  deploy-docs:
    name: Deploy Documentation
    needs: [configure, approve]
    if: needs.configure.outputs.deploy_docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build backend OpenAPI docs
        working-directory: ./backend
        run: |
          if [ -f "pyproject.toml" ]; then
            pip install --quiet poetry
            poetry install --no-interaction --without dev
            echo "Backend docs stub generated"
          else
            echo "No backend project found, skipping OpenAPI generation"
          fi

      - name: Build API documentation site
        run: |
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CommercePulse Documentation</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
              h1 { color: #2563eb; }
              .card { border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1.5rem; margin: 1rem 0; }
              a { color: #2563eb; }
            </style>
          </head>
          <body>
            <h1>CommercePulse Documentation</h1>
            <p>Version: <code>${{ needs.configure.outputs.image_tag }}</code></p>
            <p>Environment: <code>${{ needs.configure.outputs.environment }}</code></p>
            <div class="card">
              <h2>API Reference</h2>
              <p><a href="/redoc">ReDoc</a> | <a href="/docs">Swagger UI</a> | <a href="/openapi.json">OpenAPI JSON</a></p>
            </div>
            <div class="card">
              <h2>Services</h2>
              <ul>
                <li>Backend API: <code>/api/v1</code></li>
                <li>Health Check: <code>/api/v1/health</code></li>
                <li>Frontend App: <code>/</code></li>
              </ul>
            </div>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    name: Trigger Deploy (${{ needs.configure.outputs.environment }})
    needs: [configure, build-and-push-images, deploy-docs]
    if: always() && needs.build-and-push-images.result != 'skipped' || needs.deploy-docs.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.configure.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ needs.configure.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images built:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/commercepulse-backend:${{ needs.configure.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/commercepulse-frontend:${{ needs.configure.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/commercepulse-nginx:${{ needs.configure.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
