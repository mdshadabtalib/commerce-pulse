[tool.poetry]
name = "commerce-pulse-backend"
version = "1.0.0"
description = "CommercePulse - E-commerce Analytics & Insights Platform Backend"
authors = ["CommercePulse Team <team@commercepulse.ai>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
argon2-cffi = "^23.1.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
celery = "^5.4.0"
redis = "^5.0.8"
python-multipart = "^0.0.12"
pandas = "^2.2.2"
numpy = "^1.26.4"
openpyxl = "^3.1.5"
statsmodels = "^0.14.2"
prophet = "^1.1.5"
scikit-learn = "^1.5.1"
xgboost = "^2.1.1"
httpx = "^0.27.2"
boto3 = "^1.35.18"
python-dotenv = "^1.0.1"
email-validator = "^2.2.0"
stripe = "^10.12.0"
slowapi = "^0.1.9"
sentry-sdk = "^2.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"
ruff = "^0.6.7"
mypy = "^1.11.2"
black = "^24.8.0"
isort = "^5.13.2"

[tool.poetry.scripts]
start = "app.main:start_app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101", "S311", "B018"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_fallback = true
strict_equality = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=80"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
